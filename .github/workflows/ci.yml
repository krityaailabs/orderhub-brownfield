name: ci

on:
  push:
  pull_request:

jobs:
  orders-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Lint
        run: python -m ruff check services/orders tools
      - name: Test
        working-directory: services/orders
        run: python -m pytest -q
      - name: Test course tools
        run: python -m pytest -q tools/tests

  billing-contract:
    # AC-8 of docs/specs/returns.md: the order service's handoff still feeds the Java batch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Billing end to end
        run: python tools/e2e_billing.py
      - name: Legacy output unchanged (golden master, Section 8)
        run: python tools/billing_golden.py check
      - name: Old and new tax paths identical (Project 2)
        run: python tools/billing_compare.py

  legacy-billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and self-test
        run: legacy/billing/build.sh
