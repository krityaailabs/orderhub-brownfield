name: security

# Required check for main (Lab s07): set it under Settings > Branches > branch protection rules
# (or a ruleset) > Require status checks > "security-gate".
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Security gate (secrets, agent permissions, static analysis, dependencies, canary)
        run: python tools/security_gate.py
