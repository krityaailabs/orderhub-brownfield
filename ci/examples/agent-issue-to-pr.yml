# EXAMPLE ONLY (Lecture 9.2/9.7): copy to .github/workflows/ after reviewing it. Verified against
# the Claude Code GitHub Actions docs on 6 October 2026; re-check inputs before use.
# Runs the agent when a person adds the "agent-ok" label to an issue. The agent opens a PR;
# required checks run on it; branch protection requires a human approval to merge.
name: agent-issue-to-pr

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-${{ github.event.issue.number }}   # one run per issue at a time
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  agent:
    if: github.event.label.name == 'agent-ok' && github.event.sender.type == 'User'   # people only, never bots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kill switch
        run: |
          if [ "${{ vars.AGENT_PIPELINE_ENABLED }}" != "true" ]; then echo "agent pipeline disabled"; exit 1; fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read AGENTS.md and issue #${{ github.event.issue.number }}. Implement it as one small pull request.
            Change only files under services/orders/ and docs/. Write or update tests first.
            Run make test-py and make lint before opening the pull request. Do not edit existing tests.
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Edit,Bash(make test-py),Bash(make lint),Bash(git diff *)"
# Then, in the repository settings: branch protection (or a ruleset) on main requiring the ci and
# security workflows, one approving review, and "require approval of the most recent reviewable push"
# so whoever pushed last can't be the approver.
